<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Finanzas Personales: registre sus gastos e ingresos, controle presupuestos y revise resúmenes por período." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#f7f5f0" />
    <script>
      // Theme before first paint: the stored choice wins, else the system
      // preference. Runs synchronously in head so there is no wrong-theme flash.
      (function () {
        try {
          var stored = localStorage.getItem('finanzas-theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#1a1815' : '#f7f5f0');
        } catch (err) {
          // Sandboxed storage or no matchMedia: the light theme applies.
        }
      })();
    </script>
    <title>Finanzas Personales</title>
  </head>
  <body>
    <!--
      THESIS: La billetera — the Argentine fintech screen language for the owner's own money: the money is always the loudest thing, one saturated action color exists only where something can be done, state lives in chips. Refuses the generic dashboard table sea.
      OWN-WORLD: warm neutral ground and white cards, near-black warm ink with big tabular figures for every amount, ONE saturated green reserved for actionable elements, semantic red/amber chips for status; bottom bar at thumb reach on phones, calm light ground for day and night scanning.
      STORY: the owner records an expense in seconds, sees the month total and the FX-at-entry beside the row, watches the ARS conversion live while typing a USD amount, and trusts the badges that say when data is not fresh.
      FIRST VIEWPORT: Transacciones — month total per currency up top, entry card below, list with rate column; the action color on Guardar only.
      FORM: candidate 6 of the grounded list — seed 196064b8.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
